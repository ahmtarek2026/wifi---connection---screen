<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wi-Fi Settings</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px;
  min-height: 100vh;
  background: #f1f5f9;
  font-family: Arial, sans-serif;
  color: #172033;
  display: grid;
  place-items: center;
}

.phone {
  width: 100%;
  max-width: 360px;
  background: white;
  padding: 24px;
  border-radius: 28px;
  box-shadow: 0 12px 35px #00000012;
}

h1 { font-size: 26px; margin-bottom: 8px; }
.subtitle { color: #64748b; font-size: 14px; }

.status {
  margin: 22px 0;
  padding: 14px;
  background: #eff6ff;
  border-radius: 14px;
  color: #1d4ed8;
  font-size: 14px;
}

.network {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 0;
  border-bottom: 1px solid #e2e8f0;
}

.network:last-child { border-bottom: 0; }

.wifi { font-size: 24px; }

.details { flex: 1; }
.name { font-weight: 600; }
.small { font-size: 12px; color: #64748b; margin-top: 5px; }

button {
  border: 0;
  background: #2563eb;
  color: white;
  padding: 12px;
  width: 100%;
  border-radius: 12px;
  margin-top: 22px;
  cursor: pointer;
}
</style>
</head>
<body>
<main class="phone">
  <h1>Wi-Fi</h1>
  <p class="subtitle">Choose a network to connect</p>

  <div class="status" id="status">
    Connecting to Home_WiFi...
  </div>

  <div class="network">
    <span class="wifi">◉</span>
    <div class="details">
      <div class="name">Home_WiFi</div>
      <div class="small" id="connection">Connecting...</div>
    </div>
    <span>◌</span>
  </div>

  <div class="network">
    <span class="wifi">◉</span>
    <div class="details">
      <div class="name">Office_Network</div>
      <div class="small">Secured network</div>
    </div>
    <span>🔒</span>
  </div>

  <div class="network">
    <span class="wifi">◉</span>
    <div class="details">
      <div class="name">Guest_WiFi</div>
      <div class="small">Available</div>
    </div>
    <span>🔒</span>
  </div>

  <button onclick="refreshNetworks()">Refresh networks</button>
</main>

<script>
function refreshNetworks() {
  document.getElementById("status").textContent =
    "Scanning for available networks...";
  document.getElementById("connection").textContent =
    "Searching...";
}
</script>
</body>
</html>
